name: Deploy

# Every push to main runs type-check + the test suite, then deploys to
# Cloudflare Workers. Manual runs possible from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The job needs nothing from GitHub — deploys authenticate with the
# CLOUDFLARE_API_TOKEN repo secret — so grant it no token scopes at all.
permissions: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # v7 tags, pinned to commit SHAs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build & deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
