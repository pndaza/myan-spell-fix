<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ဿ — the standalone "sa" that only exists through correct spelling:
       the mark of a word spelled right. Amber on the warm dark of the app. -->
  <rect width="64" height="64" rx="14" fill="#16130f"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#3a3328" stroke-width="2"/>
  <text x="32" y="46" font-family="Padauk, 'Myanmar Text', sans-serif" font-size="40" font-weight="700" fill="#ffb86b" text-anchor="middle">ဿ</text>
</svg>
